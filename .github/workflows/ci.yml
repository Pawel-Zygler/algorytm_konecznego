name: Algorytm Konecznego CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Verify Python syntax
        run: |
          python -m py_compile backend/analyzer.py
          python -m py_compile backend/main.py
          python -m py_compile backend/config.py

      - name: Verify Extension JS syntax
        run: |
          node -c extension/content.js
          node -c extension/popup.js

      - name: Run Automated Test Suite (Unit & All 4 API Scenarios)
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m pytest tests/unit/ -v -s --tb=short

      - name: Generate CI Summary Report & API Call Inspection
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🛡️ Algorytm Konecznego CI Test & API Inspection Report

          ### 🇵🇱 Scenariusz 1: Happy Path – Analiza Polski na Wikipedii
          **Opis testu**: Test weryfikuje pełną ścieżkę analityczną API dla tekstu charakteryzującego ustrój i historię Polski w kręgu cywilizacji łacińskiej. Ewaluowana jest autonomia sumienia obywateli, wyższość norm etycznych nad dekretami państwowymi, pluralizm źródeł prawa oraz brak uświęcenia aparatu urzędniczego.

          <details>
          <summary>🔍 <b>Pokaż zapytanie API (API Call Request Body JSON)</b></summary>

          ```json
          {
            "title": "Polska - Wikipedia",
            "url": "https://pl.wikipedia.org/wiki/Polska",
            "target_indices": ["sacrality", "conscience_status", "duty_source"],
            "text": "Polska (Rzeczpospolita Polska) – państwo położone w Europie Środkowej, członek Unii Europejskiej oraz paktu NATO. Cywilizacyjnie Polska od czasu przyjęcia Chrztu w 966 roku nieprzerwanie należy do kręgu cywilizacji łacińskiej..."
          }
          ```
          </details>

          <details>
          <summary>📊 <b>Pokaż odpowiedź API (API Call Response Result JSON)</b></summary>

          ```json
          {
            "status_code": 200,
            "sacrality_score": 0.075,
            "conscience_autonomous_score": 0.925,
            "duty_source_personalistic_score": 0.900,
            "ethical_coherence_score": 7.0,
            "generalia_diagnosis": "Dominacja Szeregu Personalistycznego (Cywilizacja Łacińska)",
            "result_status": "✅ PASSED"
          }
          ```
          </details>

          ---

