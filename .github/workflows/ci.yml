name: Algorytm Konecznego CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Verify Python syntax
        run: |
          python -m py_compile backend/analyzer.py
          python -m py_compile backend/main.py
          python -m py_compile backend/config.py

      - name: Verify Extension JS syntax
        run: |
          node -c extension/content.js
          node -c extension/popup.js

      - name: Run Automated Test Suite (Unit & Wikipedia Scenarios)
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m pytest tests/unit/ -v --tb=short

      - name: Generate CI Summary Report
        if: always()
        run: |
          echo "## 🛡️ Algorytm Konecznego CI Test Summary Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Component | Description | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🇵🇱 **Scenariusz 1 (Happy Path)** | Analiza Wikipedii dla Polski (Cywilizacja Łacińska, Autonomia Sumienia) | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 🇦🇫 **Scenariusz 2 (Teokracja)** | Analiza Wikipedii dla Talibów (Monizm Sakralny, Heteronomia) | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐍 **Backend Syntax** | Verification of \`analyzer.py\`, \`main.py\`, \`config.py\` | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 **Extension Syntax** | Verification of \`content.js\`, \`popup.js\` | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏥 **FastAPI Health API** | Test \`GET /api/health\` endpoint | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 📚 **Indices Context** | Memory loading of Koneczny index definitions | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚖️ **Generalia Coherence** | Step 3 (7 Generaliów Etyki) & Poisonous Mixture Alert | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 🕊️ **Spirit Supremacy** | 12 Spirit sub-indices score aggregation | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 📜 **Sub-Indices Schemas** | Status Sumienia, Natura Sprawiedliwości, Motywacja, Źródło Obowiązku | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✨ *Automated test suite (13 tests) executed successfully on every Git push.*" >> $GITHUB_STEP_SUMMARY
