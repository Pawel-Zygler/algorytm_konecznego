          **Opis testu**: Test weryfikuje zachowanie API przy analizie tekstu opisującego ustrój Talibów w Afganistanie. Badany jest wysoki stopień sakralizacji instytucji państwowych, teokracja, nakładanie zewnętrznej heteronomii moralnej przez aparaty przymusu (Hizba) oraz brak autonomii sumienia jednostki.

