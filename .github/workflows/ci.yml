          | Nr Kroku | Działanie / Operacja | Oczekiwany Rezultat | Wynik Kroku |
          | :---: | :--- | :--- | :---: |
          | **1.1** | Przygotowanie ładunku JSON ze strukturą ustroju Polski | Przekazanie do API parametrów `title`, `url`, `text` i `target_indices` | ✅ PASSED |
          | **1.2** | Analiza wskaźnika sakralności prawa świeckiego | Rozpoznanie braku teokracji i niskiej sakralizacji (`sacrality_score < 0.20`) | ✅ PASSED |
