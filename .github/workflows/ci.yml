          **Opis testu**: Test weryfikuje pobieranie oraz ekstrakcję tekstu z oficjalnego dokumentu PDF wydanego przez Senat RP (`konstytucja_rp_miniatura_w._polska.pdf`) za pomocą biblioteki PyMuPDF (fitz), a następnie przelicza indeksy ustrojowo-etyczne.

