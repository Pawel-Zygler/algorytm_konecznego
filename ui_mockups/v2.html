<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>V2: Klasyczna Łacina</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f4efe6;
      background-image: url('https://www.transparenttextures.com/patterns/old-wall.png');
      font-family: 'Lora', serif;
      color: #2c251d;
      display: flex;
      justify-content: center;
      padding: 40px;
      min-height: 100vh;
    }

    .panel {
      width: 420px;
      background: #fffdf9;
      border: 2px solid #8c7b65;
      padding: 30px;
      box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.1);
      position: relative;
    }
    
    .panel::before {
      content: '';
      position: absolute;
      top: 6px; left: 6px; right: 6px; bottom: 6px;
      border: 1px solid #c4b9a8;
      pointer-events: none;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 1px solid #c4b9a8;
      padding-bottom: 15px;
    }

    .header h1 {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      font-weight: 700;
      color: #4a3f35;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }
    
    .header p {
      font-size: 14px;
      font-style: italic;
      color: #6b6054;
    }

    /* Gauge styles */
    .gauge-container {
      text-align: center;
      margin-bottom: 25px;
    }

    .gauge-svg {
      width: 150px;
      overflow: visible;
    }

    .gauge-bg {
      fill: none;
      stroke: #e6dfd3;
      stroke-width: 12;
    }

    .gauge-fg {
      fill: none;
      stroke: #8c7b65;
      stroke-width: 12;
      stroke-dasharray: 125.66;
      stroke-dashoffset: 32.67; /* 74% */
      transition: stroke-dashoffset 1s ease-out;
    }

    .gauge-text {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 700;
      fill: #4a3f35;
    }

    .gauge-label {
      margin-top: -5px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 1px;
      color: #4a3f35;
      font-weight: 700;
    }

    /* Dual gauge layout */
    .dual-gauges {
      display: flex;
      justify-content: space-around;
      margin-bottom: 25px;
      border-bottom: 1px dashed #c4b9a8;
      padding-bottom: 20px;
    }
    .dual-gauges .gauge-svg {
      width: 110px;
    }
    .dual-gauges .gauge-fg.red { stroke: #991b1b; stroke-dashoffset: 9.8; }
    .dual-gauges .gauge-fg.blue { stroke: #1e3a8a; stroke-dashoffset: 18.8; }

    .grid-quincunx {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-top: 15px;
    }

    .node {
      text-align: center;
    }
    .node-title {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      color: #6b6054;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .node-val {
      font-size: 15px;
      font-weight: 600;
      color: #2c251d;
    }

  </style>
</head>
<body>

  <div class="panel">
    <div class="header">
      <h1>Koneczny</h1>
      <p>Analysis Civilisationis</p>
    </div>

    <!-- Main Gauge -->
    <div class="gauge-container">
      <svg viewBox="0 0 100 50" class="gauge-svg">
        <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
        <path class="gauge-fg" d="M 10 50 A 40 40 0 0 1 90 50" />
        <text x="50" y="45" text-anchor="middle" class="gauge-text">74%</text>
      </svg>
      <div class="gauge-label">Zgodność z cyw. łacińską</div>
    </div>

    <!-- Dual Gauges -->
    <div class="dual-gauges">
      <div class="gauge-container" style="margin-bottom:0">
        <svg viewBox="0 0 100 50" class="gauge-svg">
          <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
          <path class="gauge-fg blue" d="M 10 50 A 40 40 0 0 1 90 50" />
          <text x="50" y="45" text-anchor="middle" class="gauge-text" style="font-size: 20px;">85%</text>
        </svg>
        <div class="gauge-label">Supremacja Ducha</div>
      </div>
      <div class="gauge-container" style="margin-bottom:0">
        <svg viewBox="0 0 100 50" class="gauge-svg">
          <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
          <path class="gauge-fg red" d="M 10 50 A 40 40 0 0 1 90 50" />
          <text x="50" y="45" text-anchor="middle" class="gauge-text" style="font-size: 20px;">92%</text>
        </svg>
        <div class="gauge-label">Wsk. Kłamstwa</div>
      </div>
    </div>

    <div style="font-family: 'Cinzel', serif; font-size: 13px; text-align: center; margin-top: 10px; color: #4a3f35; font-weight: 700;">
      Pięciomian Bytu (Quincunx)
    </div>
    <div class="grid-quincunx">
      <div class="node"><div class="node-title">DOBRO</div><div class="node-val">90%</div></div>
      <div class="node"><div class="node-title">PRAWDA</div><div class="node-val">60%</div></div>
      <div class="node"><div class="node-title">ZDROWIE</div><div class="node-val">70%</div></div>
      <div class="node"><div class="node-title">DOBROBYT</div><div class="node-val" style="color:#b45309;">50%</div></div>
      <div class="node"><div class="node-title">PIĘKNO</div><div class="node-val">80%</div></div>
    </div>
  </div>
</body>
</html>
