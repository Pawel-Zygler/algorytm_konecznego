<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>V5: Material Design</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f0f2f5;
      font-family: 'Roboto', sans-serif;
      color: #1c1e21;
      display: flex;
      justify-content: center;
      padding: 40px;
      min-height: 100vh;
    }

    .panel {
      width: 420px;
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .header {
      margin-bottom: 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a73e8;
      margin-bottom: 4px;
    }
    
    .header p {
      font-size: 14px;
      color: #5f6368;
    }

    /* Gauge styles */
    .gauge-container {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 20px 15px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
      border: 1px solid #e8eaed;
    }

    .gauge-svg {
      width: 130px;
      overflow: visible;
    }

    .gauge-bg {
      fill: none;
      stroke: #e8eaed;
      stroke-width: 10;
      stroke-linecap: round;
    }

    .gauge-fg {
      fill: none;
      stroke: #1a73e8;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 125.66;
      stroke-dashoffset: 32.67; 
      transition: stroke-dashoffset 1s ease-out;
    }

    .gauge-text {
      font-size: 22px;
      font-weight: 700;
      fill: #202124;
    }

    .gauge-label {
      margin-top: -5px;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      color: #5f6368;
      letter-spacing: 0.5px;
    }

    /* Dual gauge layout */
    .dual-gauges {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }
    .dual-gauges .gauge-container {
      flex: 1;
      padding: 15px 10px 5px;
      margin-bottom: 0;
    }
    .dual-gauges .gauge-svg {
      width: 90px;
    }
    .dual-gauges .gauge-fg.red { stroke: #ea4335; stroke-dashoffset: 9.8; }
    .dual-gauges .gauge-fg.blue { stroke: #34a853; stroke-dashoffset: 18.8; }
    .dual-gauges .gauge-text { font-size: 18px; }

    .grid-quincunx {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .node {
      background: #fff;
      border: 1px solid #e8eaed;
      border-radius: 6px;
      padding: 8px 0;
      text-align: center;
    }
    .node-title {
      font-size: 9px;
      font-weight: 700;
      color: #5f6368;
      margin-bottom: 4px;
    }
    .node-val {
      font-size: 13px;
      font-weight: 700;
      color: #202124;
    }
    .node-val.warning {
      color: #ea4335;
    }

  </style>
</head>
<body>

  <div class="panel">
    <div class="header">
      <h1>Koneczny Analysis</h1>
      <p>Results Dashboard</p>
    </div>

    <!-- Main Gauge -->
    <div class="gauge-container">
      <svg viewBox="0 0 100 50" class="gauge-svg">
        <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
        <path class="gauge-fg" d="M 10 50 A 40 40 0 0 1 90 50" />
        <text x="50" y="45" text-anchor="middle" class="gauge-text">74%</text>
      </svg>
      <div class="gauge-label">Zgodność Łacińska</div>
    </div>

    <!-- Dual Gauges -->
    <div class="dual-gauges">
      <div class="gauge-container">
        <svg viewBox="0 0 100 50" class="gauge-svg">
          <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
          <path class="gauge-fg blue" d="M 10 50 A 40 40 0 0 1 90 50" />
          <text x="50" y="45" text-anchor="middle" class="gauge-text">85%</text>
        </svg>
        <div class="gauge-label" style="font-size: 10px;">Supr. Ducha</div>
      </div>
      <div class="gauge-container">
        <svg viewBox="0 0 100 50" class="gauge-svg">
          <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
          <path class="gauge-fg red" d="M 10 50 A 40 40 0 0 1 90 50" />
          <text x="50" y="45" text-anchor="middle" class="gauge-text">92%</text>
        </svg>
        <div class="gauge-label" style="font-size: 10px;">Kłamstwo</div>
      </div>
    </div>

    <div style="font-size: 12px; font-weight: 500; text-align: center; color: #5f6368; margin-top: 15px;">
      Współmierność Quincunx
    </div>
    <div class="grid-quincunx">
      <div class="node"><div class="node-title">DOBRO</div><div class="node-val">90%</div></div>
      <div class="node"><div class="node-title">PRAWDA</div><div class="node-val">60%</div></div>
      <div class="node"><div class="node-title">ZDROWIE</div><div class="node-val">70%</div></div>
      <div class="node"><div class="node-title">DOBROBYT</div><div class="node-val warning">50%</div></div>
      <div class="node"><div class="node-title">PIĘKNO</div><div class="node-val">80%</div></div>
    </div>
  </div>
</body>
</html>
