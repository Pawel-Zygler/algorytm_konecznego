<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>V4: Neumorfizm (Soft UI)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #e0e5ec;
      font-family: 'Nunito', sans-serif;
      color: #4a5568;
      display: flex;
      justify-content: center;
      padding: 40px;
      min-height: 100vh;
    }

    .panel {
      width: 420px;
      background: #e0e5ec;
      border-radius: 30px;
      padding: 35px;
      box-shadow: 
        9px 9px 16px rgb(163,177,198,0.6), 
        -9px -9px 16px rgba(255,255,255, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 800;
      color: #2d3748;
      margin-bottom: 5px;
    }
    
    .header p {
      font-size: 13px;
      font-weight: 600;
      color: #718096;
    }

    /* Gauge styles */
    .gauge-container {
      background: #e0e5ec;
      border-radius: 20px;
      padding: 25px 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
      box-shadow: inset 6px 6px 10px 0 rgba(163,177,198,0.5), inset -6px -6px 10px 0 rgba(255,255,255,0.8);
    }

    .gauge-svg {
      width: 140px;
      overflow: visible;
    }

    .gauge-bg {
      fill: none;
      stroke: #d1d9e6;
      stroke-width: 10;
      stroke-linecap: round;
    }

    .gauge-fg {
      fill: none;
      stroke: #38b2ac;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 125.66;
      stroke-dashoffset: 32.67; 
      transition: stroke-dashoffset 1s ease-out;
    }

    .gauge-text {
      font-size: 24px;
      font-weight: 800;
      fill: #2d3748;
    }

    .gauge-label {
      margin-top: -5px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #718096;
      letter-spacing: 1px;
    }

    /* Dual gauge layout */
    .dual-gauges {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
    }
    .dual-gauges .gauge-container {
      flex: 1;
      padding: 20px 10px 10px;
      margin-bottom: 0;
    }
    .dual-gauges .gauge-svg {
      width: 90px;
    }
    .dual-gauges .gauge-text {
      font-size: 20px;
    }
    .dual-gauges .gauge-fg.red { stroke: #fc8181; stroke-dashoffset: 9.8; }
    .dual-gauges .gauge-fg.blue { stroke: #63b3ed; stroke-dashoffset: 18.8; }

    .grid-quincunx {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .node {
      background: #e0e5ec;
      border-radius: 12px;
      padding: 10px 0;
      text-align: center;
      box-shadow: 
        4px 4px 8px rgb(163,177,198,0.6), 
        -4px -4px 8px rgba(255,255,255, 0.5);
    }
    .node-title {
      font-size: 9px;
      font-weight: 800;
      color: #a0aec0;
      margin-bottom: 4px;
    }
    .node-val {
      font-size: 14px;
      font-weight: 800;
      color: #4a5568;
    }
    .node-val.warning {
      color: #fc8181;
    }

  </style>
</head>
<body>

  <div class="panel">
    <div class="header">
      <h1>Koneczny App</h1>
      <p>Analiza Parametryczna</p>
    </div>

    <!-- Main Gauge -->
    <div class="gauge-container">
      <svg viewBox="0 0 100 50" class="gauge-svg">
        <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
        <path class="gauge-fg" d="M 10 50 A 40 40 0 0 1 90 50" />
        <text x="50" y="45" text-anchor="middle" class="gauge-text">74%</text>
      </svg>
      <div class="gauge-label">Zgodność: Łacińska</div>
    </div>

    <!-- Dual Gauges -->
    <div class="dual-gauges">
      <div class="gauge-container">
        <svg viewBox="0 0 100 50" class="gauge-svg">
          <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
          <path class="gauge-fg blue" d="M 10 50 A 40 40 0 0 1 90 50" />
          <text x="50" y="45" text-anchor="middle" class="gauge-text">85%</text>
        </svg>
        <div class="gauge-label" style="font-size: 9px;">Supr. Ducha</div>
      </div>
      <div class="gauge-container">
        <svg viewBox="0 0 100 50" class="gauge-svg">
          <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
          <path class="gauge-fg red" d="M 10 50 A 40 40 0 0 1 90 50" />
          <text x="50" y="45" text-anchor="middle" class="gauge-text">92%</text>
        </svg>
        <div class="gauge-label" style="font-size: 9px;">Kłamstwo</div>
      </div>
    </div>

    <div style="font-size: 12px; font-weight: 800; text-align: center; color: #a0aec0; margin-top: 10px;">
      QUINCUNX
    </div>
    <div class="grid-quincunx">
      <div class="node"><div class="node-title">DOBRO</div><div class="node-val">90%</div></div>
      <div class="node"><div class="node-title">PRAWDA</div><div class="node-val">60%</div></div>
      <div class="node"><div class="node-title">ZDROWIE</div><div class="node-val">70%</div></div>
      <div class="node"><div class="node-title">DOBROBYT</div><div class="node-val warning">50%</div></div>
      <div class="node"><div class="node-title">PIĘKNO</div><div class="node-val">80%</div></div>
    </div>
  </div>
</body>
</html>
