<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>V1: Mroczny Glassmorphism</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f111a;
      background-image: 
        radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
        radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
        radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
      font-family: 'Inter', sans-serif;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 40px;
      min-height: 100vh;
    }

    .panel {
      width: 420px;
      background: rgba(30, 33, 43, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    
    .header p {
      font-size: 13px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    /* Gauge styles */
    .gauge-container {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 24px 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .gauge-svg {
      width: 140px;
      overflow: visible;
    }

    .gauge-bg {
      fill: none;
      stroke: rgba(255,255,255,0.1);
      stroke-width: 8;
      stroke-linecap: round;
    }

    .gauge-fg {
      fill: none;
      stroke: url(#grad);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 125.66; /* PI * R(40) */
      stroke-dashoffset: 32.67; 
      transition: stroke-dashoffset 1s ease-out;
    }

    .gauge-text {
      font-size: 22px;
      font-weight: 800;
      fill: #fff;
    }

    .gauge-label {
      margin-top: -10px;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #9ca3af;
      font-weight: 600;
    }

    /* Dual gauge layout */
    .dual-gauges {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }
    .dual-gauges .gauge-container {
      flex: 1;
      padding: 20px 10px 12px;
      margin-bottom: 0;
    }
    .dual-gauges .gauge-svg {
      width: 100px;
    }
    .dual-gauges .gauge-fg.red { stroke: #ef4444; stroke-dashoffset: 9.8; /* 92.2% */ }
    .dual-gauges .gauge-fg.blue { stroke: #3b82f6; stroke-dashoffset: 18.8; /* 85% */ }

    .grid-quincunx {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 20px;
    }

    .node {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 12px 0;
      text-align: center;
      transition: all 0.2s;
    }
    .node:hover {
      background: rgba(255,255,255,0.08);
      transform: translateY(-2px);
    }
    .node-title {
      font-size: 10px;
      color: #9ca3af;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .node-val {
      font-size: 14px;
      font-weight: 700;
      color: #f3f4f6;
    }

  </style>
</head>
<body>

  <div class="panel">
    <div class="header">
      <h1>KONE\CZNY</h1>
      <p>Analiza Cywilizacyjna</p>
    </div>

    <!-- Main Gauge (Zgodność Łacińska) -->
    <div class="gauge-container">
      <svg viewBox="0 0 100 50" class="gauge-svg">
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#3b82f6" />
          </linearGradient>
        </defs>
        <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
        <path class="gauge-fg" d="M 10 50 A 40 40 0 0 1 90 50" />
        <text x="50" y="45" text-anchor="middle" class="gauge-text">74%</text>
      </svg>
      <div class="gauge-label">Zgodność z cyw. łacińską</div>
    </div>

    <!-- Dual Gauges -->
    <div class="dual-gauges">
      <div class="gauge-container">
        <svg viewBox="0 0 100 50" class="gauge-svg">
          <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
          <path class="gauge-fg blue" d="M 10 50 A 40 40 0 0 1 90 50" />
          <text x="50" y="45" text-anchor="middle" class="gauge-text" style="font-size: 20px;">85%</text>
        </svg>
        <div class="gauge-label">Supremacja Ducha</div>
      </div>
      <div class="gauge-container">
        <svg viewBox="0 0 100 50" class="gauge-svg">
          <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
          <path class="gauge-fg red" d="M 10 50 A 40 40 0 0 1 90 50" />
          <text x="50" y="45" text-anchor="middle" class="gauge-text" style="font-size: 20px;">92%</text>
        </svg>
        <div class="gauge-label">Wsk. Kłamstwa</div>
      </div>
    </div>

    <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #6b7280; font-weight: 700; text-align: center; margin-top: 10px;">
      Pięciomian Bytu (Quincunx)
    </div>
    <div class="grid-quincunx">
      <div class="node"><div class="node-title">DOBRO</div><div class="node-val">90%</div></div>
      <div class="node"><div class="node-title">PRAWDA</div><div class="node-val">60%</div></div>
      <div class="node"><div class="node-title">ZDROWIE</div><div class="node-val">70%</div></div>
      <div class="node"><div class="node-title">DOBROBYT</div><div class="node-val" style="color:#f59e0b;">50%</div></div>
      <div class="node"><div class="node-title">PIĘKNO</div><div class="node-val">80%</div></div>
    </div>
  </div>
</body>
</html>
