<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>V3: Brutalizm Akademicki</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #e5e5e5;
      font-family: 'Space Mono', monospace;
      color: #000;
      display: flex;
      justify-content: center;
      padding: 40px;
      min-height: 100vh;
    }

    .panel {
      width: 420px;
      background: #fff;
      border: 4px solid #000;
      padding: 25px;
      box-shadow: 12px 12px 0px #000;
    }

    .header {
      text-align: left;
      margin-bottom: 25px;
      border-bottom: 4px solid #000;
      padding-bottom: 10px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -1px;
    }

    /* Gauge styles */
    .gauge-container {
      border: 2px solid #000;
      padding: 15px;
      margin-bottom: 20px;
      position: relative;
      background: #f4f4f5;
    }

    .gauge-svg {
      width: 100%;
      height: 100px;
      overflow: visible;
    }

    .gauge-bg {
      fill: none;
      stroke: #d4d4d8;
      stroke-width: 10;
      stroke-linecap: square;
    }

    .gauge-fg {
      fill: none;
      stroke: #000;
      stroke-width: 10;
      stroke-linecap: square;
      stroke-dasharray: 125.66;
      stroke-dashoffset: 32.67; 
      transition: stroke-dashoffset 1s ease-out;
    }

    .gauge-text {
      font-size: 30px;
      font-weight: 700;
      fill: #000;
    }

    .gauge-label {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      border-top: 2px solid #000;
      padding-top: 8px;
      margin-top: 5px;
    }

    /* Dual gauge layout */
    .dual-gauges {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }
    .dual-gauges .gauge-container {
      flex: 1;
      margin-bottom: 0;
      padding: 10px;
    }
    .dual-gauges .gauge-svg {
      height: 70px;
    }
    .dual-gauges .gauge-fg.red { stroke: #dc2626; stroke-dashoffset: 9.8; }
    .dual-gauges .gauge-fg.blue { stroke: #2563eb; stroke-dashoffset: 18.8; }
    .dual-gauges .gauge-text { font-size: 24px; }

    .grid-quincunx {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    .grid-quincunx .node:last-child {
      grid-column: span 2;
    }

    .node {
      border: 2px solid #000;
      padding: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .node-title {
      font-size: 11px;
      font-weight: 700;
    }
    .node-val {
      font-size: 14px;
      font-weight: 700;
      background: #000;
      color: #fff;
      padding: 2px 6px;
    }
    .node-val.warning {
      background: #dc2626;
    }

  </style>
</head>
<body>

  <div class="panel">
    <div class="header">
      <h1>[Koneczny]</h1>
    </div>

    <!-- Main Gauge -->
    <div class="gauge-container">
      <svg viewBox="0 0 100 50" class="gauge-svg">
        <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
        <path class="gauge-fg" d="M 10 50 A 40 40 0 0 1 90 50" />
        <text x="50" y="45" text-anchor="middle" class="gauge-text">74%</text>
      </svg>
      <div class="gauge-label">Zgodność: Łacińska</div>
    </div>

    <!-- Dual Gauges -->
    <div class="dual-gauges">
      <div class="gauge-container">
        <svg viewBox="0 0 100 50" class="gauge-svg">
          <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
          <path class="gauge-fg blue" d="M 10 50 A 40 40 0 0 1 90 50" />
          <text x="50" y="45" text-anchor="middle" class="gauge-text">85%</text>
        </svg>
        <div class="gauge-label" style="font-size: 10px;">Supr. Ducha</div>
      </div>
      <div class="gauge-container">
        <svg viewBox="0 0 100 50" class="gauge-svg">
          <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
          <path class="gauge-fg red" d="M 10 50 A 40 40 0 0 1 90 50" />
          <text x="50" y="45" text-anchor="middle" class="gauge-text">92%</text>
        </svg>
        <div class="gauge-label" style="font-size: 10px;">Kłamstwo</div>
      </div>
    </div>

    <div style="font-size: 12px; font-weight: 700; border-bottom: 2px solid #000; padding-bottom: 5px; margin-top: 15px;">
      QUINCUNX DATA:
    </div>
    <div class="grid-quincunx">
      <div class="node"><div class="node-title">DOBRO</div><div class="node-val">90%</div></div>
      <div class="node"><div class="node-title">PRAWDA</div><div class="node-val">60%</div></div>
      <div class="node"><div class="node-title">ZDROWIE</div><div class="node-val">70%</div></div>
      <div class="node"><div class="node-title">DOBROBYT</div><div class="node-val warning">50%</div></div>
      <div class="node"><div class="node-title">PIĘKNO</div><div class="node-val">80%</div></div>
    </div>
  </div>
</body>
</html>
