<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Schematów Feliksa Konecznego – Podgląd z Zoom & Pan</title>
  <meta name="description" content="Interaktywny podgląd oryginalnych diagramów historiozoficznych Feliksa Konecznego z pełną kontrolą powiększenia (Zoom In, Zoom Out, Pan) i matrycami syntetycznymi.">

  <!-- Google Fonts: Outfit & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <style>
    :root {
      --bg-main: #060913;
      --bg-panel: rgba(15, 23, 42, 0.88);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(56, 189, 248, 0.45);
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-purple: #a855f7;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-blue: #0284c7;
      --accent-pink: #ec4899;
      --accent-violet: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
      background-image: 
        radial-gradient(circle at 12% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 88% 20%, rgba(168, 85, 247, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(16, 185, 129, 0.06) 0%, transparent 50%);
      background-attachment: fixed;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(6, 9, 19, 0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, #10b981 0%, #0284c7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
    }

    .brand-title {
      font-size: 16.5px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }

    .civ-filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .civ-pill {
      font-size: 11px;
      padding: 5px 11px;
      border-radius: 7px;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: rgba(15, 23, 42, 0.85);
      color: var(--text-muted);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .civ-pill:hover, .civ-pill.active {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
    }
    .civ-pill.lacinska.active { border-color: var(--accent-emerald); background: rgba(16, 185, 129, 0.25); color: #6ee7b7; box-shadow: 0 0 16px rgba(16, 185, 129, 0.45); }
    .civ-pill.bizantynska.active { border-color: var(--accent-purple); background: rgba(168, 85, 247, 0.25); color: #d8b4fe; }
    .civ-pill.turanska.active { border-color: var(--accent-amber); background: rgba(245, 158, 11, 0.25); color: #fde68a; }
    .civ-pill.arabska.active { border-color: var(--accent-blue); background: rgba(2, 132, 199, 0.25); color: #7dd3fc; }
    .civ-pill.chinska.active { border-color: var(--accent-rose); background: rgba(244, 63, 94, 0.25); color: #fecdd3; }
    .civ-pill.braminska.active { border-color: var(--accent-violet); background: rgba(139, 92, 246, 0.25); color: #c4b5fd; }
    .civ-pill.zydowska.active { border-color: var(--accent-pink); background: rgba(236, 72, 153, 0.25); color: #fbcfe8; }

    /* Nav Tabs */
    .nav-tabs-wrapper {
      background: rgba(15, 23, 42, 0.7);
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 24px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      max-width: 1440px;
      margin: 0 auto;
    }

    .tab-btn {
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .tab-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.98) 100%);
      border: 1px solid var(--accent-cyan);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4), 0 0 14px rgba(56, 189, 248, 0.3);
    }

    main {
      max-width: 1440px;
      margin: 18px auto;
      padding: 0 24px 60px;
    }

    .view-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }

    .view-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
      gap: 12px;
    }

    .view-title {
      font-size: 19px;
      font-weight: 900;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .view-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .meta-tag {
      font-size: 10.5px;
      padding: 4px 9px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      font-family: 'Fira Code', monospace;
      border: 1px solid var(--border-subtle);
    }

    /* =========================================================================
       ZOOM & PAN VIEWPORT SYSTEM
       ========================================================================= */
    .diagram-wrapper {
      margin: 18px 0;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(8, 14, 27, 0.98);
      box-shadow: 0 8px 28px rgba(0,0,0,0.5);
    }

    .zoom-toolbar {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .zoom-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .zoom-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .zoom-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-cyan);
      color: #38bdf8;
    }

    .zoom-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .zoom-badge {
      background: #0284c7;
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: 'Fira Code', monospace;
      font-weight: 700;
      font-size: 10.5px;
    }

    .zoom-hint {
      font-size: 10.5px;
      color: #64748b;
    }

    .diagram-pan-viewport {
      width: 100%;
      height: 600px;
      overflow: hidden;
      position: relative;
      cursor: grab;
      user-select: none;
      background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .diagram-pan-viewport:active {
      cursor: grabbing;
    }

    .diagram-pan-canvas {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform 0.08s ease-out;
    }

    .diagram-pan-canvas svg {
      max-width: none !important;
      max-height: none !important;
      display: block;
    }

    /* Style rendered mermaid nodes */
    .mermaid .node rect, 
    .mermaid .node circle, 
    .mermaid .node ellipse, 
    .mermaid .node polygon {
      stroke-width: 2px !important;
      rx: 8px !important;
      ry: 8px !important;
    }

    /* Matrix Table */
    .matrix-table-wrap {
      overflow-x: auto;
      margin-top: 18px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
      min-width: 900px;
    }

    th {
      background: rgba(15, 23, 42, 0.95);
      color: #94a3b8;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.05em;
      padding: 12px 14px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.08);
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      vertical-align: top;
      line-height: 1.45;
    }

    tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.015);
    }

    td.pillar-cell {
      background: rgba(16, 185, 129, 0.09) !important;
      color: #ffffff;
      font-weight: 700;
      border-left: 2px solid var(--accent-emerald);
      border-right: 2px solid var(--accent-emerald);
    }

    .quote-box {
      background: rgba(30, 27, 75, 0.4);
      border-left: 4px solid #a855f7;
      border-radius: 0 10px 10px 0;
      padding: 14px 18px;
      margin-top: 18px;
      font-size: 12px;
      color: #e2e8f0;
      font-style: italic;
      line-height: 1.6;
    }

    .quote-author {
      font-style: normal;
      font-weight: 800;
      color: #c084fc;
      margin-top: 5px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>

    // Zoom & Pan state management
    const zoomStates = {};

    function getZoomState(tabId) {
      if (!zoomStates[tabId]) {
        zoomStates[tabId] = { scale: 1.15, x: 0, y: 0, isDragging: false, startX: 0, startY: 0 };
      }
      return zoomStates[tabId];
    }

    function applyTransform(tabId) {
      const state = getZoomState(tabId);
      const canvas = document.getElementById('canvas-' + tabId);
      const badge = document.getElementById('zoom-badge-' + tabId);
      if (canvas) {
        canvas.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
      }
      if (badge) {
        badge.textContent = Math.round(state.scale * 100) + '%';
      }
    }

    function zoomIn(tabId) {
      const state = getZoomState(tabId);
      state.scale = Math.min(state.scale + 0.18, 3.5);
      applyTransform(tabId);
    }

    function zoomOut(tabId) {
      const state = getZoomState(tabId);
      state.scale = Math.max(state.scale - 0.18, 0.4);
      applyTransform(tabId);
    }

    function zoomReset(tabId) {
      const state = getZoomState(tabId);
      state.scale = 1.0;
      state.x = 0;
      state.y = 0;
      applyTransform(tabId);
    }

    function zoomFit(tabId) {
      const state = getZoomState(tabId);
      state.scale = 1.25;
      state.x = 0;
      state.y = 0;
      applyTransform(tabId);
    }

    function setupPanZoomEvents(tabId) {
      const viewport = document.getElementById('viewport-box-' + tabId);
      if (!viewport) return;
      const state = getZoomState(tabId);

      viewport.onwheel = (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.12 : -0.12;
        state.scale = Math.min(Math.max(state.scale + delta, 0.4), 3.5);
        applyTransform(tabId);
      };

      viewport.onmousedown = (e) => {
        state.isDragging = true;
        state.startX = e.clientX - state.x;
        state.startY = e.clientY - state.y;
        viewport.style.cursor = 'grabbing';
      };

      window.onmousemove = (e) => {
        if (!state.isDragging) return;
        state.x = e.clientX - state.startX;
        state.y = e.clientY - state.startY;
        applyTransform(tabId);
      };

      window.onmouseup = () => {
        if (state.isDragging) {
          state.isDragging = false;
          viewport.style.cursor = 'grab';
        }
      };
    }

    // Civ table filter
    function setCivFilter(civKey) {
      document.querySelectorAll('.civ-pill').forEach(btn => {
        btn.classList.toggle('active', btn.classList.contains(civKey));
      });
      document.querySelectorAll('tbody tr').forEach(row => {
        const rowCiv = row.getAttribute('data-civ');
        if (civKey === 'all' || !rowCiv || rowCiv === civKey) {
          row.style.display = '';
        } else {
          row.style.display = 'none';
        }
      });
    }
